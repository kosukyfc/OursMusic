services:
  - type: web
    name: oursmusic-backend
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: oursmusic-db
          property: connectionString
      - key: PORT
        value: "3000"
    healthCheckPath: /health
    healthCheckInterval: 30

databases:
  - name: oursmusic-db
    databaseName: postgres
    user: postgres
    plan: free
