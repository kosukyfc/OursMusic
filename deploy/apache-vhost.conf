# ══════════════════════════════════════════════════════════════════════════════
# OursMusic — Apache VirtualHost com segurança completa
# Arquivo: C:\xampp\apache\conf\extra\oursmusics.conf
#
# Módulos necessários (habilitar no httpd.conf):
#   LoadModule proxy_module              modules/mod_proxy.so
#   LoadModule proxy_http_module         modules/mod_proxy_http.so
#   LoadModule proxy_wstunnel_module     modules/mod_proxy_wstunnel.so
#   LoadModule rewrite_module            modules/mod_rewrite.so
#   LoadModule headers_module            modules/mod_headers.so
#   LoadModule ssl_module                modules/mod_ssl.so
#   LoadModule deflate_module            modules/mod_deflate.so
#   LoadModule expires_module            modules/mod_expires.so
#   LoadModule ratelimit_module          modules/mod_ratelimit.so  (opcional)
#   LoadModule evasive_module            modules/mod_evasive.so    (opcional)
# ══════════════════════════════════════════════════════════════════════════════

# ── Ocultar versão do Apache ──────────────────────────────────────────────────
ServerTokens Prod
ServerSignature Off

# ── HTTP → HTTPS (redirect permanente) ───────────────────────────────────────
<VirtualHost *:80>
    ServerName  oursmusics.shop
    ServerAlias www.oursmusics.shop

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# ── HTTPS principal ───────────────────────────────────────────────────────────
<VirtualHost *:443>
    ServerName  oursmusics.shop
    ServerAlias www.oursmusics.shop

    # ── SSL / TLS ─────────────────────────────────────────────────────────────
    SSLEngine on
    SSLCertificateFile    "C:/xampp/apache/conf/ssl/oursmusics.shop/fullchain.pem"
    SSLCertificateKeyFile "C:/xampp/apache/conf/ssl/oursmusics.shop/privkey.pem"

    # Apenas TLS 1.2 e 1.3 — desabilita versões antigas
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    # Ciphers seguros (sem RC4, DES, 3DES, MD5, EXPORT)
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:\
ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:\
ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:\
DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    SSLSessionTickets   off

    # OCSP Stapling
    SSLUseStapling          on
    SSLStaplingResponderTimeout 5
    SSLStaplingReturnResponderErrors off

    # ── Frontend React (arquivos estáticos) ───────────────────────────────────
    DocumentRoot "C:/xampp/htdocs/oursmusics"

    <Directory "C:/xampp/htdocs/oursmusics">
        Options -Indexes -ExecCGI -Includes
        AllowOverride None
        Require all granted

        # SPA: tudo que não é arquivo/pasta vai para index.html
        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI}      !^/api/
        RewriteRule ^ index.html [L]
    </Directory>

    # ── Bloquear acesso a arquivos sensíveis ──────────────────────────────────
    <FilesMatch "(\.env|\.git|\.htpasswd|composer\.(json|lock)|package\.json|package-lock\.json)$">
        Require all denied
    </FilesMatch>

    # Bloquear dot-files e diretórios ocultos
    <DirectoryMatch "^/.*/\.">
        Require all denied
    </DirectoryMatch>

    # ── Proxy reverso: /api → NestJS :3000 ───────────────────────────────────
    ProxyPreserveHost On
    ProxyRequests     Off

    # Não expõe headers internos do proxy
    ProxyPassReverseCookieDomain localhost oursmusics.shop
    ProxyPassReverseCookiePath   /api /

    # WebSocket (Socket.io) — deve vir ANTES do ProxyPass HTTP
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/api/(.*) ws://localhost:3000/$1 [P,L]

    # HTTP
    ProxyPass        /api/ http://localhost:3000/ connectiontimeout=5 timeout=30
    ProxyPassReverse /api/ http://localhost:3000/

    # Ocultar que existe um backend Node.js
    Header unset X-Powered-By
    Header unset Server
    ProxyPassReverse / http://localhost:3000/

    # ── Rate limiting nas rotas de auth (mod_ratelimit) ───────────────────────
    <Location "/api/auth/login">
        SetOutputFilter RATE_LIMIT
        SetEnv rate-limit 100
    </Location>
    <Location "/api/auth/register">
        SetOutputFilter RATE_LIMIT
        SetEnv rate-limit 50
    </Location>
    <Location "/api/auth/forgot-password">
        SetOutputFilter RATE_LIMIT
        SetEnv rate-limit 20
    </Location>

    # ── Bloquear métodos HTTP desnecessários ──────────────────────────────────
    <LimitExcept GET POST PUT PATCH DELETE OPTIONS>
        Require all denied
    </LimitExcept>

    # ── Proteção contra ataques comuns (mod_rewrite) ──────────────────────────
    RewriteEngine On

    # Bloquear User-Agents maliciosos conhecidos
    RewriteCond %{HTTP_USER_AGENT} (libwww-perl|wget|python|nikto|scan|sqlmap|nmap|masscan) [NC]
    RewriteRule .* - [F,L]

    # Bloquear tentativas de path traversal
    RewriteCond %{REQUEST_URI} \.\./  [NC]
    RewriteRule .* - [F,L]

    # Bloquear injeção de null bytes
    RewriteCond %{REQUEST_URI} \%00 [NC]
    RewriteRule .* - [F,L]

    # Bloquear tentativas de acesso a arquivos de configuração
    RewriteCond %{REQUEST_URI} \.(env|git|svn|htaccess|htpasswd|ini|log|sh|sql|bak|backup|old|orig)$ [NC]
    RewriteRule .* - [F,L]

    # ── Headers de segurança HTTP ─────────────────────────────────────────────
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"
    Header always set Cross-Origin-Embedder-Policy "require-corp"

    # Content Security Policy
    Header always set Content-Security-Policy "\
default-src 'self'; \
script-src 'self' 'unsafe-inline'; \
style-src 'self' 'unsafe-inline'; \
img-src 'self' data: https:; \
media-src 'self' https:; \
connect-src 'self' wss://oursmusics.shop https://oursmusics.shop; \
font-src 'self' data:; \
frame-src 'none'; \
object-src 'none'; \
base-uri 'self'; \
form-action 'self'; \
frame-ancestors 'none'; \
upgrade-insecure-requests"

    # Remover headers que revelam tecnologia
    Header unset X-Powered-By
    Header unset X-AspNet-Version
    Header unset X-AspNetMvc-Version

    # ── Cache de assets estáticos ─────────────────────────────────────────────
    <IfModule mod_expires.c>
        ExpiresActive On
        # JS/CSS com hash no nome — cache longo
        ExpiresByType text/javascript              "access plus 1 year"
        ExpiresByType application/javascript       "access plus 1 year"
        ExpiresByType text/css                     "access plus 1 year"
        # Imagens
        ExpiresByType image/webp                   "access plus 6 months"
        ExpiresByType image/png                    "access plus 6 months"
        ExpiresByType image/jpeg                   "access plus 6 months"
        ExpiresByType image/svg+xml                "access plus 6 months"
        ExpiresByType image/x-icon                 "access plus 1 year"
        # Fontes
        ExpiresByType font/woff2                   "access plus 1 year"
        ExpiresByType font/woff                    "access plus 1 year"
        # HTML — sem cache (SPA sempre busca o index.html atualizado)
        ExpiresByType text/html                    "access plus 0 seconds"
        # Manifesto PWA
        ExpiresByType application/manifest+json    "access plus 0 seconds"
    </IfModule>

    # ── Compressão Gzip ───────────────────────────────────────────────────────
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/javascript
        AddOutputFilterByType DEFLATE application/javascript application/json
        AddOutputFilterByType DEFLATE image/svg+xml application/manifest+json
        AddOutputFilterByType DEFLATE font/woff font/woff2
        # Não comprimir o que já está comprimido
        SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|webp|mp3|mp4|gz|zip)$ no-gzip
    </IfModule>

    # ── Logs ──────────────────────────────────────────────────────────────────
    ErrorLog  "C:/xampp/apache/logs/oursmusics-error.log"
    CustomLog "C:/xampp/apache/logs/oursmusics-access.log" combined

    # Não logar assets estáticos (reduz ruído)
    SetEnvIf Request_URI "\.(ico|css|js|gif|jpg|jpeg|png|webp|woff2?)$" static_asset
    CustomLog "C:/xampp/apache/logs/oursmusics-access.log" combined env=!static_asset

</VirtualHost>

# ── OCSP Stapling cache global ────────────────────────────────────────────────
SSLStaplingCache shmcb:C:/xampp/apache/logs/ssl_stapling(32768)
