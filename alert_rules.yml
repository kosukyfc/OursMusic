groups:
  - name: OursMusic Alerts
    interval: 30s
    rules:
      # API Response Time
      - alert: HighAPIResponseTime
        expr: histogram_quantile(0.95, http_request_duration_seconds) > 1
        for: 5m
        annotations:
          summary: "High API response time detected"
          description: "95th percentile response time > 1s"

      # Error Rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        annotations:
          summary: "High error rate detected"
          description: "Error rate > 5%"

      # Database Connection Pool
      - alert: DatabaseConnectionPoolExhausted
        expr: pg_stat_activity_count > 90
        for: 2m
        annotations:
          summary: "Database connection pool near capacity"
          description: "{{ $value }} connections in use (limit: 100)"

      # Redis Memory Usage
      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        annotations:
          summary: "Redis memory usage high"
          description: "Memory usage > 85%"

      # Cache Hit Rate Low
      - alert: LowCacheHitRate
        expr: redis_keyspace_hits_total / (redis_keyspace_hits_total + redis_keyspace_misses_total) < 0.7
        for: 10m
        annotations:
          summary: "Low Redis cache hit rate"
          description: "Hit rate below 70%"

      # Service Down
      - alert: BackendServiceDown
        expr: up{job="backend"} == 0
        for: 1m
        annotations:
          summary: "Backend service is down"
          description: "Cannot reach backend service"

      # High CPU Usage
      - alert: HighCPUUsage
        expr: (1 - avg by (cpu) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 0.8
        for: 5m
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage > 80%"

      # Disk Space Low
      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs"} / node_filesystem_size_bytes) < 0.1
        for: 5m
        annotations:
          summary: "Low disk space"
          description: "Disk {{ $labels.device }} has < 10% free space"

      # Database Query Slow
      - alert: SlowDatabaseQuery
        expr: pg_stat_statements_mean_exec_time > 1000
        for: 5m
        annotations:
          summary: "Slow database query detected"
          description: "Mean query time > 1000ms"

      # API Rate Limit Approaching
      - alert: RateLimitApproaching
        expr: rate(http_requests_total[1m]) > 900
        for: 2m
        annotations:
          summary: "API rate limit approaching"
          description: "Request rate > 900/min (limit: 1000/min)"
