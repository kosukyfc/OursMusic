name: music_app
description: OursMusic — self-hosted music streaming app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.3.0
  provider: ^6.0.0
  
  # Audio Playback
  just_audio: ^0.9.0
  audio_session: ^0.1.16
  volume_controller: ^2.0.0
  
  # Networking
  http: ^1.2.0
  dio: ^5.4.1
  socket_io_client: ^2.0.3+1
  
  # Local Storage
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0
  
  # UI & Images
  cached_network_image: ^3.4.0
  image_picker: ^1.1.0
  
  # Firebase (Analytics, Crashlytics)
  firebase_core: ^2.24.0
  firebase_analytics: ^10.7.0
  firebase_crashlytics: ^3.4.0
  
  # Notifications & Auth
  firebase_messaging: ^14.7.0
  local_auth: ^2.2.0
  
  # File & System
  open_file: ^3.3.2
  permission_handler: ^11.3.1
  
  # Utilities
  intl: ^0.19.0
  logger: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  
  # Testing
  mockito: ^5.4.4
  # test_coverage: ^0.7.0  # Removed: use flutter test --coverage instead

flutter:
  uses-material-design: true
